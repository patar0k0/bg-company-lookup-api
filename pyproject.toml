[project]
name = "bg-company-lookup"
version = "0.1.0"
description = "Справки за българска фирма (ЕИК/име) през companybook.bg API + Flask обвивка"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "flask>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
prod = [
    "gunicorn>=22.0; platform_system != 'Windows'",
]

[project.scripts]
bg-company-lookup = "bg_company_lookup.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
